<div class="row">
    <div class="col-6">
        1.interpolation

        <p>firstName => {{firstName}}</p>
        <span>lastName => {{lastName}}</span>
        <div>{{rollNo}}</div>
        <span>{{isActive}}</span>
    </div>
    <div class="col-6">
        <input type="text" [value]="firstName">
        <br>
        <input type="text" [placeholder]="myPlaceholder">
        <br>
        <div [class]="divClassName" style="height: 100px; width: 100px;">

        </div>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <button class="btn btn-success" (click)="showWelcomeMessage()">Show welcome text</button>
    </div>
    <div class="col-3">
        <select (change)="onCityChange()">
            <option value="Bangkok">Bangkok</option>
            <option value="Pattaya">Pattaya</option>

        </select>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <span>change variable value use ngModel</span>
        <input type="text" [(ngModel)]="firstName">
    </div>
    <div class="col-3">
        <select [(ngModel)]="selectedCity">
            <option value="Bangkok">Bangkok</option>
            <option value="Pattaya">Pattaya</option>

        </select>
        -{{selectedCity}}
    </div>
</div>
